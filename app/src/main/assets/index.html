<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#1a73e8">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Dẫn Đường Việt</title>
<link rel="stylesheet" href="leaflet/leaflet.css">
<script src="leaflet/leaflet.js"></script>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:#e8eaed;overflow:hidden}
#map{position:absolute;top:0;right:0;bottom:0;left:0}
button{font:inherit;cursor:pointer;border:0}
.card{background:#fff;border-radius:16px;box-shadow:0 2px 12px rgba(0,0,0,.18)}
#top{position:absolute;top:10px;left:10px;right:10px;z-index:1000;padding:10px 10px 8px}
.row{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.row input{flex:1;border:1px solid #dadce0;border-radius:10px;padding:10px 12px;font-size:16px;outline:none;background:#f8f9fa}
.row input:focus{border-color:#1a73e8;background:#fff}
.dot{width:12px;height:12px;border-radius:50%;flex:none}
.dot.g{background:#1a73e8;box-shadow:0 0 0 3px #d2e3fc}.dot.r{background:#ea4335;box-shadow:0 0 0 3px #fad2cf}
#swap,#clr,#btnMic{width:38px;height:38px;border-radius:10px;background:#f1f3f4;font-size:18px}
#modes{display:flex;gap:6px;overflow-x:auto}
#modes button{flex:1;white-space:nowrap;padding:8px 6px;border-radius:20px;background:#f1f3f4;font-size:14px}
#modes button.on{background:#1a73e8;color:#fff}
#sugg{max-height:45vh;overflow:auto}
#sugg div{padding:10px 8px;border-top:1px solid #f1f3f4;font-size:15px}
#sugg div small{display:block;color:#5f6368;font-size:12px;margin-top:2px}
#sugg div:active{background:#e8f0fe}
#fabs{position:absolute;right:12px;bottom:200px;z-index:900;display:flex;flex-direction:column;gap:10px}
#fabs button{width:48px;height:48px;border-radius:50%;background:#fff;box-shadow:0 2px 8px rgba(0,0,0,.25);font-size:20px}
#fabs button.on{background:#1a73e8;color:#fff}
#sheet{position:absolute;left:0;right:0;bottom:0;z-index:1000;border-radius:18px 18px 0 0;padding:12px 14px 14px;padding:12px 14px calc(14px + env(safe-area-inset-bottom));max-height:60vh;overflow:auto}
#alts{display:flex;gap:8px;overflow-x:auto;margin-bottom:10px}
#alts button{flex:none;padding:8px 12px;border-radius:12px;background:#f1f3f4;text-align:left;border:2px solid transparent}
#alts button.on{border-color:#1a73e8;background:#e8f0fe}
#alts b{display:block;font-size:17px}#alts span{font-size:13px;color:#5f6368}
#sum{font-size:14px;color:#5f6368;margin-bottom:10px}
.btns{display:flex;gap:8px}
.btns button{flex:1;padding:12px;border-radius:24px;font-size:16px;font-weight:600;background:#f1f3f4}
.btns .pri{background:#1a73e8;color:#fff}
#steps{margin-top:10px;display:none}
#steps div{display:flex;gap:10px;padding:9px 2px;border-top:1px solid #f1f3f4;font-size:14px;align-items:center}
#steps i{font-style:normal;font-size:20px;width:28px;text-align:center}
#steps small{margin-left:auto;color:#5f6368;white-space:nowrap}
#banner{position:absolute;top:10px;left:10px;right:10px;z-index:1000;background:#0b8043;color:#fff;border-radius:16px;padding:12px 14px;box-shadow:0 2px 12px rgba(0,0,0,.3);padding-top:calc(12px + env(safe-area-inset-top))}
#bMain{display:flex;align-items:center;gap:12px}
#bIcon{font-size:44px;line-height:1;width:52px;text-align:center}
#bDist{font-size:28px;font-weight:700}
#bText{font-size:17px;line-height:1.25}
#bThen{margin-top:8px;font-size:14px;background:rgba(0,0,0,.18);border-radius:10px;padding:6px 10px;display:none}
#navbar{position:absolute;left:0;right:0;bottom:0;z-index:1000;border-radius:18px 18px 0 0;padding:12px 14px 12px;padding:12px 14px calc(12px + env(safe-area-inset-bottom));display:flex;align-items:center;gap:12px}
#spd{width:58px;height:58px;border-radius:50%;border:3px solid #dadce0;display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:700;font-size:20px;flex:none}
#spd small{font-size:10px;font-weight:400;color:#5f6368}
#nInfo{flex:1}#nTime{font-size:22px;font-weight:700;color:#0b8043}#nSub{font-size:14px;color:#5f6368}
#btnExit{background:#ea4335;color:#fff;padding:12px 18px;border-radius:24px;font-weight:600;font-size:16px}
#toast{position:absolute;left:50%;bottom:110px;transform:translateX(-50%);background:#323232;color:#fff;padding:10px 16px;border-radius:10px;font-size:14px;z-index:2000;opacity:0;transition:opacity .3s;pointer-events:none;max-width:90%;text-align:center}
#toast.show{opacity:1}
.me{width:26px;height:26px}
.me svg{width:26px;height:26px;filter:drop-shadow(0 1px 2px rgba(0,0,0,.4));transition:transform .4s}
.pin{font-size:30px;line-height:30px;text-align:center}
.pop button{display:block;width:100%;margin-top:6px;padding:8px;border-radius:8px;background:#e8f0fe;color:#1a73e8;font-weight:600}
.pop b{display:block;max-width:220px}
#lim{width:58px;height:58px;border-radius:50%;border:6px solid #e53935;background:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:22px;color:#000;flex:none}
#spd.over{border-color:#e53935;background:#e53935;color:#fff}#spd.over small{color:#fff}
#lanes{display:none;gap:4px;margin-top:8px;background:rgba(0,0,0,.25);border-radius:10px;padding:4px 6px;width:max-content;max-width:100%}
#lanes span{font-size:26px;line-height:1;width:30px;text-align:center;opacity:.35}#lanes span.ok{opacity:1}
#camBadge{margin-top:8px;background:#f9ab00;color:#000;font-weight:700;border-radius:10px;padding:6px 10px;font-size:15px;width:max-content}
.cam{font-size:16px;line-height:24px;text-align:center;background:#fff;border:2px solid #f9ab00;border-radius:50%;box-shadow:0 1px 4px rgba(0,0,0,.35)}
.pop small{display:block;color:#5f6368;margin-top:4px}
body.night:not(.sat) .leaflet-tile-pane{filter:invert(1) hue-rotate(180deg) brightness(.9) contrast(.9)}
body.night .card{background:#202124;color:#e8eaed}
body.night .row input{background:#303134;border-color:#5f6368;color:#e8eaed}
body.night #modes button,body.night .btns button,body.night #alts button,body.night #swap,body.night #clr,body.night #fabs button{background:#303134;color:#e8eaed}
body.night #modes button.on,body.night .btns .pri,body.night #fabs button.on{background:#8ab4f8;color:#202124}
body.night #alts button.on{border-color:#8ab4f8;background:#394457}
body.night #sum,body.night #nSub,body.night #alts span,body.night #steps small{color:#bdc1c6}
body.night #sugg div{border-color:#3c4043}body.night #sugg div small{color:#bdc1c6}
body.night #steps div{border-color:#3c4043}body.night #spd{border-color:#5f6368}
/* Màn hình ngang (màn ô tô, máy tính bảng): bảng điều khiển dồn sang trái, bản đồ rộng bên phải */
@media (orientation:landscape) and (min-width:700px){
  #top,#banner{right:auto;width:400px}
  #sheet,#navbar{right:auto;left:10px;bottom:10px;width:400px;border-radius:18px}
  #sheet{max-height:calc(100vh - 190px)}
  #fabs{bottom:20px}
  #sugg{max-height:calc(100vh - 200px)}
}
#diag{position:absolute;top:0;right:0;bottom:0;left:0;z-index:3000;background:rgba(0,0,0,.55);display:flex;align-items:center;justify-content:center;padding:12px}
#diagBox{background:#fff;color:#202124;border-radius:16px;max-width:640px;width:100%;max-height:100%;overflow:auto;padding:16px}
#diagBox h3{margin:0 0 10px}#diagOut{font-size:14px;line-height:1.5;white-space:pre-wrap;word-break:break-word}
#diagBox button{margin-top:12px;width:100%;padding:12px;border-radius:24px;background:#1a73e8;color:#fff;font-weight:600;font-size:16px}
/* Trình duyệt cũ (màn ô tô Android 6) không hỗ trợ gap trong flex: dùng lề thay thế */
@supports not (gap: 1px){
  .row>*+*,#modes button+button,#alts button+button,.btns button+button{margin-left:8px}
  #navbar>*+*{margin-left:12px}#bMain>*+*{margin-left:12px}#lanes span+span{margin-left:4px}
  #fabs button+button{margin-top:10px}#steps div>*+*{margin-left:10px}
}
.altTip{background:#fff;border:1px solid #9aa0a6;border-radius:8px;font-weight:600;color:#3c4043;padding:2px 6px;box-shadow:0 1px 3px rgba(0,0,0,.3)}
#lim.est{border-style:dashed;position:relative}
#lim.est:after{content:'ước tính';position:absolute;bottom:-16px;left:50%;transform:translateX(-50%);font-size:10px;font-weight:400;color:#5f6368;white-space:nowrap}
[hidden]{display:none!important}
</style>
</head>
<body>
<div id="map"></div>

<div id="top" class="card">
  <div class="row"><span class="dot g"></span><input id="inFrom" placeholder="Vị trí của bạn" autocomplete="off"><button id="swap" title="Đổi chiều">⇅</button></div>
  <div class="row"><span class="dot r"></span><input id="inTo" placeholder="Tìm điểm đến..." autocomplete="off"><button id="btnMic" title="Tìm bằng giọng nói" hidden><svg viewBox="0 0 24 24" width="22" height="22"><path fill="#1a73e8" d="M12 14a3 3 0 0 0 3-3V5a3 3 0 0 0-6 0v6a3 3 0 0 0 3 3zm5-3a5 5 0 0 1-10 0H5a7 7 0 0 0 6 6.92V21h2v-3.08A7 7 0 0 0 19 11h-2z"/></svg></button><button id="clr" title="Xóa">✕</button></div>
  <div id="sugg"></div>
  <div id="modes">
    <button data-p="car" class="on">🚗 Ô tô</button>
    <button data-p="moto">Xe máy</button>
    <button data-p="bike">🚲 Xe đạp</button>
    <button data-p="foot">🚶 Đi bộ</button>
  </div>
</div>

<div id="banner" hidden>
  <div id="bMain"><div id="bIcon">↑</div><div><div id="bDist"></div><div id="bText"></div></div></div>
  <div id="bThen"></div>
  <div id="lanes"></div>
  <div id="camBadge" hidden></div>
</div>

<div id="fabs">
  <button id="btnRot" title="Xoay bản đồ theo hướng đi"><svg viewBox="0 0 24 24" width="24" height="24"><path d="M12 2 7.5 12h9z" fill="#ea4335"/><path d="M12 22 7.5 12h9z" fill="#9aa0a6"/></svg></button>
  <button id="btnCam" title="Đánh dấu camera tại đây" hidden>📷</button>
  <button id="btnLayer" title="Lớp bản đồ">🌐</button>
  <button id="btnVoice" class="on" title="Giọng nói">🔊</button>
  <button id="btnLoc" title="Vị trí của tôi">◎</button>
  <button id="btnDiag" title="Kiểm tra lỗi">🔧</button>
</div>

<div id="sheet" class="card" hidden>
  <div id="alts"></div>
  <div id="sum"></div>
  <div class="btns">
    <button class="pri" id="btnGo">▶ Bắt đầu</button>
    <button id="btnSim">Mô phỏng</button>
    <button id="btnSteps">Các bước</button>
  </div>
  <div id="steps"></div>
</div>

<div id="navbar" class="card" hidden>
  <div id="spd"><span id="spdV">0</span><small>km/h</small></div>
  <div id="lim" hidden><span id="limV"></span></div>
  <div id="nInfo"><div id="nTime"></div><div id="nSub"></div></div>
  <button id="btnExit">Thoát</button>
</div>

<div id="toast"></div>
<div id="diag" hidden><div id="diagBox"><h3>🔧 Kiểm tra app</h3><div id="diagOut"></div><button id="diagVoice">🔊 Nghe thử giọng</button><button id="diagClose">Đóng</button></div></div>

<script>
'use strict';
/* ============ CẤU HÌNH DỊCH VỤ ============ */
const ROUTERS = {
  car:  ['https://routing.openstreetmap.de/routed-car/route/v1/driving/', 'https://router.project-osrm.org/route/v1/driving/'],
  bike: ['https://routing.openstreetmap.de/routed-bike/route/v1/driving/'],
  moto: ['https://routing.openstreetmap.de/routed-car/route/v1/driving/', 'https://router.project-osrm.org/route/v1/driving/'],
  foot: ['https://routing.openstreetmap.de/routed-foot/route/v1/driving/']
};
const NOMINATIM = 'https://nominatim.openstreetmap.org/';
const SIM_SPEED = {car: 40, moto: 35, bike: 15, foot: 5}; // km/h khi mô phỏng
const OFF_ROUTE_M = {car: 45, moto: 40, bike: 35, foot: 30};

/* ============ TRẠNG THÁI ============ */
const S = {
  me: null, acc: 999, heading: 0, speed: 0, lastPos: null,
  origin: null, dest: null, profile: 'car',
  routes: [], sel: 0, layers: [],
  nav: false, sim: null, follow: true, voice: true,
  hintIdx: 0, offCount: 0, lastReroute: 0, spoken: {}, wake: null, activeInput: null
};

/* ============ TIỆN ÍCH ============ */
const $ = id => document.getElementById(id);
const toRad = d => d * Math.PI / 180;
function hav(a, b) { // a,b = [lat,lng] -> mét
  const R = 6371000, dLat = toRad(b[0] - a[0]), dLng = toRad(b[1] - a[1]);
  const h = Math.sin(dLat/2)**2 + Math.cos(toRad(a[0]))*Math.cos(toRad(b[0]))*Math.sin(dLng/2)**2;
  return 2 * R * Math.asin(Math.sqrt(h));
}
function bearing(a, b) {
  const y = Math.sin(toRad(b[1]-a[1])) * Math.cos(toRad(b[0]));
  const x = Math.cos(toRad(a[0]))*Math.sin(toRad(b[0])) - Math.sin(toRad(a[0]))*Math.cos(toRad(b[0]))*Math.cos(toRad(b[1]-a[1]));
  return (Math.atan2(y, x) * 180 / Math.PI + 360) % 360;
}
function fmtDist(m) {
  if (m < 1000) return (m < 100 ? Math.max(0, Math.round(m/5)*5) : Math.round(m/10)*10) + ' m';
  return (m/1000).toFixed(m < 10000 ? 1 : 0).replace('.', ',') + ' km';
}
function fmtDur(s) {
  const m = Math.round(s/60);
  if (m < 60) return Math.max(1, m) + ' phút';
  return Math.floor(m/60) + ' giờ ' + (m%60 ? (m%60) + ' phút' : '');
}
const p2 = n => (n < 10 ? '0' : '') + n;
function fmtClock(d) { return p2(d.getHours()) + ':' + p2(d.getMinutes()); }
function speakDist(m) {
  if (m >= 1000) return (Math.round(m/100)/10).toString().replace('.', ' phẩy ') + ' ki lô mét';
  return (Math.round(m/50)*50 || Math.round(m/10)*10) + ' mét';
}
let toastT;
function toast(t, ms = 2500) { const e = $('toast'); e.textContent = t; e.classList.add('show'); clearTimeout(toastT); toastT = setTimeout(() => e.classList.remove('show'), ms); }
function esc(s) { return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
const store = {
  get(k, d) { try { const v = JSON.parse(localStorage.getItem(k)); return v == null ? d : v; } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
};

/* ============ BẢN ĐỒ ============ */
const map = L.map('map', {zoomControl: false, attributionControl: true}).setView([20.25, 105.97], 13);
const baseStreet = L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {maxZoom: 21, maxNativeZoom: 19, attribution: '© OpenStreetMap'});
// Vệ tinh nét cao: ảnh Esri Clarity (ít nén, sắc nét hơn), tải ảnh độ phân giải cao cho màn hình điện thoại (retina),
// phóng to tới mức 21; dự phòng sang Esri World Imagery nếu ô ảnh Clarity lỗi.
// Máy cũ/yếu (WebView dưới Chrome 70, ví dụ màn ô tô Android 6): tải ít ô ảnh hơn cho nhanh
const OLD_WV = (() => { const m = navigator.userAgent.match(/Chrome\/(\d+)/); return !!m && +m[1] < 70; })();
const isHiDPI = !OLD_WV && (window.devicePixelRatio || 1) > 1.4;
// Esri có độ phủ khác nhau từng nơi: chỗ thiếu ảnh nó trả về ô xám "Map data not yet available".
// Lớp này tự nhận ra ô xám đó và thay bằng ảnh nét nhất có ở mức thấp hơn (phóng to phần tương ứng).
const SAT_NATIVE = isHiDPI ? 18 : 19; // màn hình nét cao tự cộng thêm 1 mức
const SAT_OPT = {maxZoom: 21, maxNativeZoom: SAT_NATIVE, detectRetina: isHiDPI, keepBuffer: OLD_WV ? 1 : 4, updateWhenZooming: false, attribution: '© Esri, Maxar, Earthstar Geographics'};
const SAT_URLS = ['https://clarity.maptiles.arcgis.com/arcgis/rest/services/World_Imagery/MapServer/tile/',
                  'https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/'];
const _probe = document.createElement('canvas'); _probe.width = _probe.height = 16;
function isNoDataTile(img) {
  try {
    const g = _probe.getContext('2d');
    g.drawImage(img, 0, 0, 16, 16);
    const d = g.getImageData(0, 0, 16, 16).data;
    let grey = 0;
    for (let i = 0; i < d.length; i += 4) {
      const r = d[i], gg = d[i+1], b = d[i+2];
      if (Math.abs(r - gg) < 8 && Math.abs(gg - b) < 8 && r > 185 && r < 240) grey++;
    }
    return grey > 256 * 0.85;
  } catch (e) { return false; }
}
const SmartSat = L.TileLayer.extend({
  createTile(coords, done) {
    const size = this.getTileSize().x;
    const box = document.createElement('div');
    box.style.overflow = 'hidden';
    const z0 = this._getZoomForUrl();
    let noCors = !!window.Android && /Chrome\/([0-5]\d|6[0-4])\./.test(navigator.userAgent); // WebView cũ: bỏ kiểm tra ô xám
    const load = (depth, src) => {
      const s = 1 << depth, z = z0 - depth, x = coords.x >> depth, y = coords.y >> depth;
      const img = new Image();
      img.onload = () => {
        if (depth < 4 && z > 3 && isNoDataTile(img)) { load(depth + 1, src); return; }
        img.style.cssText = `position:absolute;width:${size*s}px;height:${size*s}px;left:${-(coords.x % s)*size}px;top:${-(coords.y % s)*size}px`;
        box.appendChild(img); done(null, box);
      };
      img.onerror = () => {
        if (img.crossOrigin && !noCors) { noCors = true; load(depth, src); return; }
        if (src + 1 < SAT_URLS.length) load(depth, src + 1); else done(new Error('tile'), box);
      };
      if (!noCors) img.crossOrigin = 'anonymous';
      img.src = SAT_URLS[src] + z + '/' + y + '/' + x;
    };
    load(0, 0);
    return box;
  }
});
const satClarity = new SmartSat('', SAT_OPT);
map.createPane('labels'); map.getPane('labels').style.zIndex = 350; map.getPane('labels').style.pointerEvents = 'none';
const REF_OPT = {maxZoom: 21, maxNativeZoom: SAT_NATIVE, detectRetina: isHiDPI, pane: 'labels'};
const baseSat = L.layerGroup([
  satClarity,
  OLD_WV ? null : L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/Reference/World_Transportation/MapServer/tile/{z}/{y}/{x}', Object.assign({opacity: .75}, REF_OPT)),
  L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/Reference/World_Boundaries_and_Places/MapServer/tile/{z}/{y}/{x}', REF_OPT)
].filter(Boolean));
baseStreet.addTo(map);
let sat = false;
$('btnLayer').onclick = () => {
  sat = !sat;
  document.body.classList.toggle('sat', sat);
  if (sat) { map.removeLayer(streetLayer()); baseSat.addTo(map); $('btnLayer').textContent = '🗺'; }
  else { map.removeLayer(baseSat); streetLayer().addTo(map); $('btnLayer').textContent = '🌐'; }
};
// Bản đồ tối ban đêm (18h–6h) như Google Maps, đỡ chói mắt khi lái xe: làm tối bản đồ thường bằng bộ lọc màu
let night = false;
function isNight() { const h = new Date().getHours(); return h >= 18 || h < 6; }
function streetLayer() { return baseStreet; }
function applyNight() {
  const n = isNight();
  if (n === night) return;
  night = n;
  document.body.classList.toggle('night', n);
}
applyNight(); setInterval(applyNight, 60000);

const meIcon = L.divIcon({className: 'me', iconSize: [26,26], iconAnchor: [13,13],
  html: '<svg viewBox="0 0 26 26"><circle cx="13" cy="13" r="11" fill="#1a73e8" stroke="#fff" stroke-width="3"/><path d="M13 5 L18 17 L13 14.5 L8 17 Z" fill="#fff"/></svg>'});
let meMarker = null, accCircle = null;
const destMarker = L.marker([0,0], {icon: L.divIcon({className: 'pin', html: '📍', iconSize: [30,30], iconAnchor: [15,28]})});
const originMarker = L.marker([0,0], {icon: L.divIcon({className: 'pin', html: '🟢', iconSize: [30,30], iconAnchor: [15,15]})});

map.on('dragstart', () => { if (S.nav) { S.follow = false; $('btnLoc').classList.remove('on'); } });

/* ============ GPS ============ */
function onPos(p) {
  const c = p.coords;
  const ll = [c.latitude, c.longitude];

/* ============ CHỈ ĐƯỜNG ============ */
const MOD = {'uturn': 'quay đầu', 'sharp right': 'ngoặt gấp sang phải', 'right': 'rẽ phải', 'slight right': 'chếch sang phải',
  'straight': 'đi thẳng', 'slight left': 'chếch sang trái', 'left': 'rẽ trái', 'sharp left': 'ngoặt gấp sang trái'};
const SIDE = {'right': 'phải', 'slight right': 'phải', 'sharp right': 'phải', 'left': 'trái', 'slight left': 'trái', 'sharp left': 'trái'};
const ARROW = {'uturn': '↶', 'sharp right': '↱', 'right': '↱', 'slight right': '↗', 'straight': '↑', 'slight left': '↖', 'left': '↰', 'sharp left': '↰'};
const cap = s => s.charAt(0).toUpperCase() + s.slice(1);
const compass = b => ['Bắc', 'Đông Bắc', 'Đông', 'Đông Nam', 'Nam', 'Tây Nam', 'Tây', 'Tây Bắc'][Math.round((b || 0) / 45) % 8];

function instr(st) {
  const m = st.maneuver, t = m.type, mod = m.modifier || 'straight';
  const r = st.name || st.ref || '';
  const on = r ? ` vào ${r}` : '', onto = r ? ` trên ${r}` : '';
  switch (t) {
    case 'depart': return `Đi về hướng ${compass(m.bearing_after)}${onto}`;
    case 'arrive': return mod.includes('left') ? 'Đã đến nơi, điểm đến ở bên trái' : mod.includes('right') ? 'Đã đến nơi, điểm đến ở bên phải' : 'Bạn đã đến nơi';
    case 'roundabout': case 'rotary': return m.exit ? `Vào vòng xuyến, đi lối ra thứ ${m.exit}${on}` : `Đi vào vòng xuyến${on}`;
    case 'exit roundabout': case 'exit rotary': return `Ra khỏi vòng xuyến${on}`;
    case 'roundabout turn': return cap(MOD[mod] || 'đi tiếp') + ' tại vòng xuyến' + on;
    case 'fork': return SIDE[mod] ? `Đi về bên ${SIDE[mod]} tại ngã ba${on}` : `Giữ thẳng tại ngã ba${on}`;
    case 'merge': return `Nhập làn${on}`;
    case 'on ramp': return `Đi vào đường dẫn${SIDE[mod] ? ' bên ' + SIDE[mod] : ''}${on}`;
    case 'off ramp': return `Đi theo lối ra${SIDE[mod] ? ' bên ' + SIDE[mod] : ''}${on}`;
    case 'end of road': return `Cuối đường, ${MOD[mod] || 'rẽ'}${on}`;
    case 'new name': case 'notification': return `Tiếp tục${onto}`;
    case 'continue':
      if (mod === 'straight') return `Đi thẳng${onto}`;
      if (mod === 'uturn') return 'Quay đầu' + on;
      return cap(MOD[mod]) + ' để tiếp tục' + onto;
    default:
      if (mod === 'straight') return `Đi thẳng${onto}`;
      return cap(MOD[mod] || 'đi tiếp') + on;
  }
}
function arrow(st) {
  const t = st.maneuver.type, mod = st.maneuver.modifier || 'straight';
  if (t === 'arrive') return '🏁';
  if (t === 'depart') return '⬆';
  if (t.includes('roundabout') || t.includes('rotary')) return '⟳';
  return ARROW[mod] || '↑';
}

function prep(r) {
  const c = r.geometry.coordinates.map(([x, y]) => [y, x]);
  const cum = [0];
  for (let i = 1; i < c.length; i++) cum.push(cum[i-1] + hav(c[i-1], c[i]));
  const steps = [];
  let idx = 0;
  r.legs.forEach(leg => leg.steps.forEach(st => {
    const loc = [st.maneuver.location[1], st.maneuver.location[0]];
    let best = idx, bd = Infinity;
    for (let i = idx; i < c.length; i++) {
      const d = hav(c[i], loc);
      if (d < bd) { bd = d; best = i; }
      if (bd < 1 || (i - idx > 400 && d > bd + 500)) break;
    }
    idx = best;
    steps.push(Object.assign({}, st, {at: cum[best], text: instr(st), icon: arrow(st)}));
  }));
  const ms = [];
  r.legs.forEach(leg => ((leg.annotation && leg.annotation.maxspeed) || []).forEach(m => ms.push(m && m.speed ? Math.round(m.unit === 'mph' ? m.speed * 1.609 : m.speed) : null)));
  const sp = [];
  r.legs.forEach(leg => ((leg.annotation && leg.annotation.speed) || []).forEach(v => sp.push(v || 0)));
  return {coords: c, cum, total: cum[cum.length-1], duration: r.duration, distance: r.distance, steps, maxspeed: ms, speeds: sp, cams: []};
}

function clearRoute() { S.layers.forEach(l => map.removeLayer(l)); S.layers = []; S.routes = []; }

async function fetchRoute(from, to) {
  const q = `${from[1]},${from[0]};${to[1]},${to[0]}?overview=full&geometries=geojson&steps=true&alternatives=3`;
  let lastErr;
  for (const base of ROUTERS[S.profile]) {
    try {
      let res = await fetch(base + q + '&annotations=maxspeed,speed');
      if (!res.ok) res = await fetch(base + q);
      const j = await res.json();
      if (j.code === 'Ok' && j.routes.length) return j.routes;
      lastErr = new Error(j.message || j.code);
    } catch (e) { lastErr = e; }
  }
  throw lastErr;
}

async function route(keepNav = false) {
  const from = S.origin ? [S.origin.lat, S.origin.lng] : S.me;
  if (!from) { toast('Đang chờ GPS... hoặc nhập điểm xuất phát'); return; }
  if (!S.dest) return;
  if (!keepNav) toast('Đang tìm đường...', 1500);
  try {
    const rs = await fetchRoute(from, [S.dest.lat, S.dest.lng]);
    clearRoute();
    S.routes = rs.map(prep); S.sel = 0;
    if (S.origin) originMarker.setLatLng(from).addTo(map); else map.removeLayer(originMarker);
    drawRoutes(!keepNav);
    if (keepNav) matchCams(); else loadCams();
    if (keepNav) { S.hintIdx = 0; S.spoken = {}; S.offCount = 0; if (S.nav) { toast('✅ Đã có đường mới'); say('Đã tìm được đường mới. ' + fmtDur(S.routes[0].duration) + ' nữa đến nơi.', true); } }
    else showSheet();
  } catch (e) {
    toast('Không tìm được đường: ' + (e.message || 'lỗi mạng'), 4000);
  }
}

function drawRoutes(fit) {
  S.layers.forEach(l => map.removeLayer(l)); S.layers = [];
  S.routes.forEach((r, i) => {
    if (i === S.sel) return;
    if (S.nav) return;
    const l = L.polyline(r.coords, {color: '#9aa0a6', weight: 7, opacity: .9}).addTo(map);
    const diff = Math.round((r.duration - S.routes[S.sel].duration) / 60);
    l.bindTooltip(`${fmtDur(r.duration)}${diff ? (diff > 0 ? ' (+' + diff + ' ph)' : ' (' + diff + ' ph)') : ''}`, {permanent: true, direction: 'center', className: 'altTip'});
    l.on('click', ev => { L.DomEvent.stop(ev); S.sel = i; drawRoutes(false); showSheet(); });
    S.layers.push(l);
  });
  const r = S.routes[S.sel];
  S.layers.push(L.polyline(r.coords, {color: '#185abc', weight: 10, opacity: 1}).addTo(map));
  S.layers.push(L.polyline(r.coords, {color: '#4285f4', weight: 6, opacity: 1}).addTo(map));
  if (fit) map.fitBounds(L.latLngBounds(r.coords), isLand() ? {paddingTopLeft: [440, 40], paddingBottomRight: [90, 40]} : {paddingTopLeft: [30, 200], paddingBottomRight: [30, 260]});
}

// Phóng to khung bản đồ bằng đường chéo màn hình, đặt vị trí xe ở giữa khung rồi xoay cả khung
function applyRot(on) {
  const el = map.getContainer();
  if (!on) {
    if (S.rotOn) {
      S.rotOn = false; S.rot = 0; S.rotPrev = 0;
      ['width', 'height', 'left', 'top', 'right', 'bottom', 'transform', 'transition', 'webkitTransform'].forEach(k => { el.style[k] = ''; });
      map.invalidateSize({pan: false});
    }
    return;
  }
  const W = innerWidth, H = innerHeight;
  const cx = isLand() ? 210 + W / 2 : W / 2, cy = H * 0.66;
  // Khung phải đủ lớn để phủ góc màn hình xa nhất khi xoay quanh vị trí xe
  const dx = Math.max(cx, W - cx), dy = Math.max(cy, H - cy), D = Math.ceil(2 * Math.sqrt(dx * dx + dy * dy)) + 4;
  if (!S.rotOn || S.rotD !== D) {
    S.rotOn = true; S.rotD = D;
    Object.assign(el.style, {width: D + 'px', height: D + 'px', left: (cx - D / 2) + 'px', top: (cy - D / 2) + 'px', right: 'auto', bottom: 'auto', transition: 'transform .8s linear'});
    map.invalidateSize({pan: false});
  }
  const h = S.heading || 0, d = ((h - S.rotPrev + 540) % 360) - 180;
  S.rotPrev = h; S.rot += d;
  el.style.webkitTransform = el.style.transform = `rotate(${-S.rot}deg)`;
}

/* ============ GIỚI HẠN TỐC ĐỘ THEO KHU VỰC (Thông tư 38/2024) ============ */
// Trong khu đông dân cư: 60 (đường đôi) / 50 (đường hai chiều).
// Ngoài khu đông dân cư: ô tô con 90 / 80, xe mô tô 70 / 60. Đường cao tốc theo biển báo.
S.area = null; S.areaAt = null; S.areaT = 0;
function estLimit(r, i, step) {

const camLayer = L.layerGroup().addTo(map);

function projFull(p, r) {
  const c = r.coords, kx = Math.cos(toRad(p[0])) * 111320, ky = 110540;
  let best = {d: Infinity, along: 0};
  for (let i = 0; i < c.length - 1; i++) {
    const ax = (c[i][1] - p[1]) * kx, ay = (c[i][0] - p[0]) * ky;
    const bx = (c[i+1][1] - p[1]) * kx, by = (c[i+1][0] - p[0]) * ky;
    const dx = bx - ax, dy = by - ay, L2 = dx*dx + dy*dy;
    let t = L2 ? -(ax*dx + ay*dy) / L2 : 0; t = Math.max(0, Math.min(1, t));

    if (d < best.d) best = {d, along: r.cum[i] + t * (r.cum[i+1] - r.cum[i])};
  }

}
function matchCams() {

  S.routes.forEach(r => {
    r.cams = [];
    const bb = L.latLngBounds(r.coords).pad(0.02);
    cs.forEach(c => {
      if (!bb.contains([c.lat, c.lng])) return; // lọc nhanh camera ngoài vùng tuyến đường
      const p = projFull([c.lat, c.lng], r);
      if (p.d < 35) r.cams.push({lat: c.lat, lng: c.lng, along: p.along, k: c.k, s: c.s});

const OVERPASS = ['https://overpass-api.de/api/interpreter', 'https://overpass.kumi.systems/api/interpreter', 'https://overpass.private.coffee/api/interpreter'];
async function loadCams() {

  if (!S.routes.length) return;
  const b = L.latLngBounds(S.routes[0].coords);
  S.routes.forEach(r => b.extend(L.latLngBounds(r.coords)));
  if (b.getNorthEast().distanceTo(b.getSouthWest()) > 300000) return; // tuyến quá dài thì bỏ qua để tránh tải nặng

  const q = `[out:json][timeout:20];(node["highway"="speed_camera"](${bb});node["enforcement"](${bb}););out body;relation["type"="enforcement"](${bb});node(r:"device");out body;`;
  // Thử lần lượt nhiều máy chủ Overpass, máy chủ nào quá tải (502...) thì chuyển máy khác

function project(p, r) {
  const c = r.coords, kx = Math.cos(toRad(p[0])) * 111320, ky = 110540;
  let best = {d: Infinity, i: 0, along: 0};
  const lo = Math.max(0, S.hintIdx - 30);
  for (let i = lo; i < c.length - 1; i++) {
    const ax = (c[i][1] - p[1]) * kx, ay = (c[i][0] - p[0]) * ky;
    const bx = (c[i+1][1] - p[1]) * kx, by = (c[i+1][0] - p[0]) * ky;
    const dx = bx - ax, dy = by - ay, L2 = dx*dx + dy*dy;
    let t = L2 ? -(ax*dx + ay*dy) / L2 : 0; t = Math.max(0, Math.min(1, t));
    const x = ax + t*dx, y = ay + t*dy, d = Math.sqrt(x*x + y*y);
    if (d < best.d) best = {d, i, along: r.cum[i] + t * (r.cum[i+1] - r.cum[i])};
    if (best.d < 15 && i - best.i > 200) break; // đã tìm thấy đoạn gần, dừng sớm
  }
  return best;
}

function navUpdate() {
  const r = S.routes[S.sel];
  if (!r || !S.me) return;
  const pr = project(S.me, r);
  S.hintIdx = pr.i;

  // Lệch tuyến -> tìm đường lại
  if (!S.sim && pr.d > OFF_ROUTE_M[S.profile] && S.acc < 60) {
    S.offCount++;
    if (S.offCount >= ((S.speed || 0) > 8 ? 2 : 3) && Date.now() - S.lastReroute > 8000) {
      S.lastReroute = Date.now(); S.offCount = 0;
      // Đang đi trên một tuyến thay thế khác -> chuyển luôn sang tuyến đó
      const alt = S.routes.findIndex((rr, idx) => idx !== S.sel && projFull(S.me, rr).d < 25);
      if (alt >= 0) {
        S.sel = alt; S.hintIdx = 0; S.spoken = {}; drawRoutes(false);
        say('Đã chuyển sang tuyến khác. ' + fmtDur(S.routes[alt].duration) + ' nữa đến nơi.');
        toast('↪ Đã chuyển sang tuyến khác');
        return;
      }
      say('Bạn đã đi lệch tuyến. Đang tìm đường mới.');
      toast('Đang tìm đường mới...');
      S.origin = null;
      route(true);
      return;
    }
  } else S.offCount = 0;

  // Bước hiện tại
  let k = 0;
  while (k + 1 < r.steps.length && r.steps[k+1].at <= pr.along + 3) k++;
  const next = r.steps[Math.min(k + 1, r.steps.length - 1)];
  const dNext = Math.max(0, next.at - pr.along);
  const remain = Math.max(0, r.total - pr.along);
  const remainT = r.duration * (remain / r.total);

  // Giao diện
  $('bIcon').textContent = next.icon;
  $('bDist').textContent = fmtDist(dNext);
  $('bText').textContent = next.text;
  const after = r.steps[k + 2];
  if (after && after.at - next.at < 150) { $('bThen').style.display = 'block'; $('bThen').textContent = `Sau đó ${after.icon} ${after.text}`; }
  else $('bThen').style.display = 'none';
  $('nTime').textContent = fmtDur(remainT);
  $('nSub').textContent = `${fmtDist(remain)} · Đến lúc ${fmtClock(new Date(Date.now() + remainT * 1000))}`;
  const kmh = Math.round((S.speed || 0) * 3.6);
  $('spdV').textContent = kmh;

  // Biển giới hạn tốc độ + cảnh báo quá tốc độ

  // Chỉ dẫn làn đường
  const ln = next.intersections && next.intersections[0] && next.intersections[0].lanes;
  if (ln && ln.length > 1 && dNext < 600) {
    $('lanes').style.display = 'flex';
    $('lanes').innerHTML = ln.map(l => `<span class="${l.valid ? 'ok' : ''}">${laneArrow(l.indications)}</span>`).join('');
  } else $('lanes').style.display = 'none';

  // Camera phía trước
  let camMsg = '';
  const look = (S.speed || 0) > 11 ? 800 : 500;
  const cam = r.cams.find(c => c.along - pr.along > -15);
  if (cam && cam.along - pr.along <= look) {

    $('camBadge').hidden = false; $('camBadge').textContent = '📷 ' + camLabel(cam) + ' · ' + fmtDist(ahead) + (cam.s ? ' · tối đa ' + cam.s : '');
    const key = cam.lat.toFixed(5) + ',' + cam.lng.toFixed(5);

    if (remain < (S.profile === 'foot' ? 15 : 25)) { say(next.text); stopNav('🏁 Bạn đã đến nơi!'); return; }
  } else {
    if (dNext <= far && dNext > near * 1.5 && !sp.far) { sp.far = 1; say(`Sau ${speakDist(dNext)}, ${next.text}`); }
    else if (dNext <= near && dNext > now && !sp.near) { sp.near = 1; sp.far = 1; say(`Sau ${speakDist(dNext)}, ${next.text}${after && after.at - next.at < 150 ? '. Sau đó ' + after.text : ''}`); }

}

function startSim() {
  const r = S.routes[S.sel];
  let along = 0, i = 0;
  const step = SIM_SPEED[S.profile] / 3.6 * 3; // nhanh gấp 3 lần thực tế
  S.sim = setInterval(() => {
    along += step;
    if (along >= r.total) along = r.total;
    while (i < r.cum.length - 2 && r.cum[i+1] < along) i++;
    const seg = r.cum[i+1] - r.cum[i], t = seg ? (along - r.cum[i]) / seg : 0;
    const a = r.coords[i], b = r.coords[i+1];
    const ll = [a[0] + (b[0]-a[0])*t, a[1] + (b[1]-a[1])*t];
    onPos({coords: {latitude: ll[0], longitude: ll[1], accuracy: 5, speed: SIM_SPEED[S.profile] / 3.6, heading: bearing(a, b)}});
    if (along >= r.total) stopSim();
  }, 1000);
  toast('Chế độ mô phỏng (tốc độ x3)');
}

    diagAdd(`Android thật: ${d.release} (SDK ${d.sdk}) · ${d.device}`);
    diagAdd('Gói WebView: ' + d.webview);
    diagAdd(`Quyền vị trí: ${d.locPerm ? '✅' : '❌ chưa cho phép'} · GPS: ${d.gpsOn ? '✅ bật' : '❌ tắt'}`);
    diagAdd(`Bộ đọc giọng nói: ${d.ttsReady ? '✅ sẵn sàng, đang dùng ' + d.ttsUsed : '❌ chưa sẵn sàng'} · công cụ mặc định: ${d.ttsDefault || 'không có'}`);
    diagAdd('Các công cụ giọng nói: ' + (d.ttsEngines.length ? d.ttsEngines.join(', ') : 'KHÔNG CÓ'));
    diagAdd('Giọng tiếng Việt: ' + d.viStatus);
    if (d.ttsMsg) diagAdd('⚠️ ' + d.ttsMsg);
    diagAdd('Chứng chỉ đóng kèm: ' + (d.ssl ? '✅' : '❌') + ' · bộ kết nối: ' + d.tls);
    diagAdd('\n— Kết nối trực tiếp từ Android —');
    d.net.forEach(n => diagAdd(`${n.ok ? '✅' : '❌'} ${n.name}: ${n.res}`));
    diagAdd('\n👉 Chụp màn hình này gửi cho người hỗ trợ.');
  } catch (e) { diagAdd('Lỗi đọc kết quả: ' + e.message); }
};
$('btnDiag').onclick = runDiag;
$('diagClose').onclick = () => { $('diag').hidden = true; };
$('diagVoice').onclick = () => { if (window.Android && Android.testVoice) Android.testVoice(); else say('Xin chào. Đây là giọng dẫn đường.'); };

function stopSim() { if (S.sim) { clearInterval(S.sim); S.sim = null; } }
</script>
</body>
