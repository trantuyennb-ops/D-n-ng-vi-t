name: Cap nhat camera

on:
  workflow_dispatch:
  schedule:
    - cron: "17 20 * * 0"   # 3h17 sáng thứ Hai giờ Việt Nam

permissions:
  contents: write

jobs:
  cams:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Tải dữ liệu camera giao thông Việt Nam (OpenStreetMap)
        run: |
          Q='[out:json][timeout:600];area["ISO3166-1"="VN"][admin_level=2]->.vn;(node["highway"="speed_camera"](area.vn);node["enforcement"](area.vn);node["man_made"="surveillance"]["surveillance"="traffic"](area.vn););out body;relation["type"="enforcement"](area.vn);node(r:"device");out body;'
          UA="DanDuongViet/1.0 (+https://github.com/trantuyennb-ops/D-n-ng-vi-t)"
          for u in https://overpass-api.de/api/interpreter https://overpass.private.coffee/api/interpreter https://overpass.kumi.systems/api/interpreter https://maps.mail.ru/osm/tools/overpass/api/interpreter; do
            for try in 1 2; do
              if curl -fsS -A "$UA" -H "Accept: */*" --max-time 600 --data-urlencode "data=$Q" "$u" -o /tmp/cams.json && python3 -c "import json;json.load(open('/tmp/cams.json'))"; then echo "OK $u"; break 2; fi
              sleep 20
            done
          done
          python3 tools/cams.py

      - name: Lưu vào repo nếu có dữ liệu mới
        run: |
          N=$(python3 -c "import json;print(len(json.load(open('app/src/main/assets/cams_vn.json'))))")
          if [ "$N" -lt 10 ]; then echo "Ít dữ liệu ($N), giữ bản cũ"; git checkout -- app/src/main/assets/cams_vn.json; exit 0; fi
          git config user.name "github-actions"; git config user.email "github-actions@users.noreply.github.com"
          git add app/src/main/assets/cams_vn.json
          git diff --cached --quiet || (git commit -m "Cập nhật dữ liệu camera ($N camera)" && git push)
