name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Tải thư viện bản đồ Leaflet vào app
        run: |
          mkdir -p app/src/main/assets/leaflet/images
          B=https://unpkg.com/leaflet@1.9.4/dist
          curl -fsSL $B/leaflet.js  -o app/src/main/assets/leaflet/leaflet.js
          curl -fsSL $B/leaflet.css -o app/src/main/assets/leaflet/leaflet.css
          for f in layers.png layers-2x.png marker-icon.png marker-icon-2x.png marker-shadow.png; do
            curl -fsSL $B/images/$f -o app/src/main/assets/leaflet/images/$f
          done
          ls -la app/src/main/assets/leaflet

      - name: Tải dữ liệu camera giao thông Việt Nam (OpenStreetMap)
        continue-on-error: true
        run: |
          Q='[out:json][timeout:180][bbox:8.0,102.0,23.5,110.0];(node["highway"="speed_camera"];node["enforcement"];node["man_made"="surveillance"]["surveillance"="traffic"];);out body;relation["type"="enforcement"];node(r:"device");out body;'
          UA="DanDuongViet/1.0 (+https://github.com/trantuyennb-ops/D-n-ng-vi-t)"
          for u in https://overpass-api.de/api/interpreter https://overpass.private.coffee/api/interpreter https://overpass.kumi.systems/api/interpreter https://maps.mail.ru/osm/tools/overpass/api/interpreter; do
            for try in 1 2; do
              if curl -fsS -A "$UA" -H "Accept: */*" --max-time 240 --data-urlencode "data=$Q" "$u" -o /tmp/cams.json && python3 -c "import json;json.load(open('/tmp/cams.json'))"; then echo "OK $u"; break 2; fi
              sleep 20
            done
          done
          python3 tools/cams.py

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.9.1"

      - name: Build release APK
        run: gradle assembleRelease --stacktrace

      - name: Rename APK
        run: |
          mkdir -p out
          cp app/build/outputs/apk/release/*.apk out/DanDuongViet.apk
          ls -la out

      - name: Publish release "latest"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest out/DanDuongViet.apk \
            --title "Dẫn Đường Việt bản mới nhất (build ${{ github.run_number }})" \
            --notes "Tải file DanDuongViet.apk bên dưới về điện thoại Android 8 trở lên để cài."
